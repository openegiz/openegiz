# OpenEgiz recommended values for Grafana
##################################################################
grafana:
  enabled: true # Value added by OpenEgiz to indicate if this component should be installed or not
  persistence:
    enabled: true
  initChownData:
    enabled: false
  service:
    type: NodePort
    nodePort: 30718
  extraConfigmapMounts:
  - name: openegiz-grafana-icon
    configMap: openegiz-grafana-branding
    mountPath: /usr/share/grafana/public/img/grafana_icon.svg
    subPath: grafana_icon.svg
    readOnly: true
  - name: openegiz-grafana-icon-build
    configMap: openegiz-grafana-branding
    mountPath: /usr/share/grafana/public/build/img/grafana_icon.svg
    subPath: grafana_icon.svg
    readOnly: true
  - name: openegiz-grafana-typelogo
    configMap: openegiz-grafana-branding
    mountPath: /usr/share/grafana/public/img/grafana_typelogo.svg
    subPath: grafana_typelogo.svg
    readOnly: true
  - name: openegiz-grafana-typelogo-build
    configMap: openegiz-grafana-branding
    mountPath: /usr/share/grafana/public/build/img/grafana_typelogo.svg
    subPath: grafana_typelogo.svg
    readOnly: true
  - name: openegiz-grafana-text-logo-dark
    configMap: openegiz-grafana-branding
    mountPath: /usr/share/grafana/public/img/grafana_text_logo_dark.svg
    subPath: grafana_text_logo_dark.svg
    readOnly: true
  - name: openegiz-grafana-text-logo-dark-build
    configMap: openegiz-grafana-branding
    mountPath: /usr/share/grafana/public/build/img/grafana_text_logo_dark.svg
    subPath: grafana_text_logo_dark.svg
    readOnly: true
  - name: openegiz-grafana-text-logo-light
    configMap: openegiz-grafana-branding
    mountPath: /usr/share/grafana/public/img/grafana_text_logo_light.svg
    subPath: grafana_text_logo_light.svg
    readOnly: true
  - name: openegiz-grafana-text-logo-light-build
    configMap: openegiz-grafana-branding
    mountPath: /usr/share/grafana/public/build/img/grafana_text_logo_light.svg
    subPath: grafana_text_logo_light.svg
    readOnly: true
  adminUser: admin
  adminPassword: admin
  grafana.ini:
    plugins:
      plugin_admin_enabled: true
      allow_loading_unsigned_plugins: openegiz-openegiz-app,openegiz-unity-panel
    navigation.app_sections:
      openegiz-openegiz-app: root -1700
  sidecar:
    datasources:
      enabled: true
    plugins:
      enabled: true
  extraInitContainers:
  - name: install-openegiz-plugins
    image: busybox
    command:
      - /bin/sh
      - -c
      - |
        #!/bin/sh
        set -euo pipefail
        mkdir -p /grafana-storage/plugins
        cd /grafana-storage/plugins
        wget --no-cache --no-check-certificate -O openegiz-openegiz-app.zip https://raw.githubusercontent.com/openegiz/helm-charts/codex/bootstrap-openegiz-helm-charts/plugins/openegiz-openegiz-app.zip
        unzip -o openegiz-openegiz-app.zip
        rm openegiz-openegiz-app.zip
        wget --no-cache --no-check-certificate -O openegiz-unity-panel.zip https://raw.githubusercontent.com/openegiz/helm-charts/codex/bootstrap-openegiz-helm-charts/plugins/openegiz-unity-panel.zip
        unzip -o openegiz-unity-panel.zip
        rm openegiz-unity-panel.zip
    volumeMounts:
    - name: storage
      mountPath: /grafana-storage

# OpenEgiz recommended values for Eclipse Hono
##################################################################
hono:
  nameHonoTenant: openegiz
  enabled: false # Value added by OpenEgiz to indicate if this component should be installed or not
  nameOverride: hono
  prometheus:
    createInstance: false
  grafana:
    enabled: false
  useLoadBalancer: false
  probes:
    livenessProbe:
      initialDelaySeconds: 900
    readinessProbe:
      initialDelaySeconds: 45
  messagingNetworkTypes:
  - "amqp"
  kafka:
    auth:
      sasl:
        jaas:
          clientUsers:
            - "hono"
            - "ditto"
          clientPasswords:
            - "hono-secret"
            - "ditto"
  kafkaMessagingClusterExample:
    enabled: false
  amqpMessagingNetworkExample:
    enabled: true
  deviceRegistryExample:
    type: mongodb
    addExampleData: false
    # Increase memory limits for device registry to prevent OOMKilled
    resources:
      requests:
        cpu: "150m"
        memory: "400Mi"
      limits:
        cpu: "1"
        memory: "512Mi"
    mongoDBBasedDeviceRegistry:
      mongodb:
        host: '{{ .Release.Name }}-mongodb' # The values are processed via the 'tpl' function here in Eclipse Hono helm, allowing the inclusion of the release name
        port: 27017
        dbName: hono
      # Increase memory limits for MongoDB based registry
      resources:
        requests:
          cpu: "150m"
          memory: "400Mi"
        limits:
          cpu: "1"
          memory: "512Mi"
    hono:
      registry:
        http:
          insecurePortEnabled: true
          insecurePortBindAddress: "0.0.0.0"
          authenticationRequired: false
  adapters: # This needs to be defined for the Eclipse Hono Helm to work (it seems to be a bug)
    mqtt:
      enabled: true
      hono:
        mqtt:
          insecurePortEnabled: true
    http:
      hono:
        http:
          insecurePortEnabled: true
    amqp:
      hono:
        amqp:
          insecurePortEnabled: true



# OpenEgiz recommended values for bitnami MongoDB
##################################################################
mongodb:
  enabled: true
  nameOverride: mongodb
  service:
    type: NodePort
    nodePorts:
      mongodb: 30717
  persistence:
    enabled: true
  auth:
    enabled: false
  image:
    registry: docker.io
    repository: bitnamilegacy/mongodb
    tag: 6.0.10-debian-11-r8
  volumePermissions:
    enabled: true
    image: 
      registry: docker.io
      repository: bitnamilegacy/os-shell
      tag: 11-debian-11-r72


# Unity WebGL Server
##################################################################
unityWebglServer:
  enabled: true
  image: nginx:alpine
  service:
    type: NodePort
    port: 80
    nodePort: 30530


# OpenEgiz recommended values for Ditto Extended API
##################################################################
extendedAPI:
  enabled: true
  image:
    repository: ghcr.io/openegiz/ditto-extended-api
    tag: latest
  allLogs: false
  service:
    port: 8080
    nodePort: 30528
      
