####################################################################################################################################
# OpenEgiz helm chart
# For local testing: make deps && helm install openegiz ./ --wait --timeout=15m --debug
####################################################################################################################################



# Example digital twin
##################################################################
example:
  enabled: false


# Persistent volumes
# Enabling these persistent volumes or not will depend on how your Kubernetes cluster works. 
# In our case, the cluster creates them automatically, so we don't need to activate them. 
# In other clusters we have seen that they are not created automatically, so to enable persistence it will be necessary to activate them.
##################################################################
persistentVolumes:
  grafana: false
  hono: false
  influxdb2: false



# OpenEgiz connections
# Components can be automatically connected during installation.
##################################################################
connections:
  ditto:
    source:
      hono:
        enabled: true
        tenantName: ditto
        username: "ditto"
        password: "ditto"
      mosquitto:
        enabled: true
        address: "telemetry/#"
    target:
      mosquitto:
        enabled: true
        address: "openegiz/#"
      kafka:
        enabled: false
        topic: "openegiz"
  
  # The data received in Eclipse Ditto must be written to a messaging broker that acts as an intermediary with telegraf, the database collector. 
  # This broker can be Kafka (kafka) or Mosquitto (mqtt). 
  telegraf:
    source:
      mosquitto:
        enabled: true
    target:
      influxdb2:
        enabled: true       


# If you need to work with your own InfluxDB2 or connect more than one, you can add them here as a list.
# They will automatically connect to Grafana and Telegraf (if enabled).
externalInfluxdb2: {}
#  - name: anyName # Do not use hyphens or underscores
#    url: https://anyPlace/
#    bucket: anyBucket
#    organization: anyOrganization
#    token: anyToken


# If you need to work with your own Mosquitto or connect more than one, you can add them here as a list.
# Currently it only connects to Eclipse Ditto, although it is planned to allow it to replace the mosquitto that will be installed in the helm (and connect with Telegraf).
externalMosquitto: {}
#  - name: anyName # Do not use hyphens or underscores
#    uri: tcp://user:pass@hostname:1883 #{protocol}://{username}:{password}@{hostname}:{port}/{path}
#    addresses: 
#      - example/#
#      - example2/#


# OpenEgiz recommended values for Eclipse Ditto
##################################################################
ditto:
  # OpenEgiz custom values
  ####################################
  # Value to indicate if this component should be installed or not
  enabled: true 

  # Enables a workaround pod that cleans up stale connections that remain in a zombie state (neither open nor closed) after a crash.
  cleanupStaleConnections: true
  

  # Eclipse Ditto Helm Chart Values
  ####################################
  nameOverride: ditto
  global:
    hashedBasicAuthUsers: false
    basicAuthUsers:
      ditto:
        user: ditto
        password: ditto
      devops:
        user: devops
        password: foobar
  nginx:
    service:
      type: NodePort
      nodePort: 30525
  swaggerui:
    enabled: false
  dittoui:
    enabled: false

  # ----------------------------------------------
  # Do not modify this unless you want to use your own mongodb or ditto mongodb. 
  # OpenEgiz can display two different mongodb charts. In case of displaying both, the bitnami one will take precedence.
  mongodb:
    enabled: false
    image: {}

  dbconfig:
    uriSecret: ditto-mongodb-connection-secret
  # ----------------------------------------------

  gateway:
    config:
      authentication:
        enablePreAuthentication: true
        devops:
          devopsPassword: foobar
          statusPassword: foobar
  #connectivity:
  #  readinessProbe:
  #    initialDelaySeconds: 30
  #  livenessProbe:
  #    initialDelaySeconds: 80



# OpenEgiz recommended values for Mosquitto
##################################################################
mosquitto:
  enabled: true # Value added by OpenEgiz to indicate if this component should be installed or not
  nameOverride: mosquitto
  service:
    type: NodePort
    nodePort: 30511
  configuration:
    authentication:
      enabled: false



# OpenEgiz recommended values for Kafka (DO NOT USE, IN DEVELOPMENT)
##################################################################
kafka:
  enabled: false

strimzi-kafka-operator: #(DO NOT USE, IN DEVELOPMENT)
  enabled: false
  installCRDs: true

# OpenEgiz recommended values for Kafka-ML (DO NOT USE, IN DEVELOPMENT)
##################################################################
kafkaml:
  enabled: false
  image:
    repository: ghcr.io/openegiz
    pullPolicy: Always
    tag: "latest"

  # Service Configuration
  # You can change type to NodePort, ClusterIP or LoadBalancer for each
  services:
    backend:
      type: NodePort
      port: 8000
      nodePort: 30527
    frontend:
      type: LoadBalancer
      port: 80
      nodePort: 
    pthexecutor:
      type: ClusterIP
      port: 8002
      nodePort: 
    tfexecutor:
      type: ClusterIP
      port: 8001
      nodePort: 

  # Infrastructure & App Config
  brokers: ""
  debug: "true"
  config:
    controlTopic: "KAFKA_ML_CONTROL_TOPIC"
    modelLoggerTopic: "FEDERATED_MODEL_CONTROL_TOPIC"
    frontendUrl: "http://localhost"
    backendAllowedHosts: "127.0.0.1,localhost"

  # Blockchain
  blockchain:
    enable: "0"
    rpcUrl: "http://blockchain:8000"
    chainId: "1337"
    networkId: "1999"
    walletAddress: "0x0"
    walletKey: "ffff"
    blockscoutUrl: "http://blockscout:8000"
    tokenName: "KafkaML-FedToken"
    tokenSymbol: "KFKMLA"
    

# OpenEgiz recommended values for Telegraf
##################################################################
telegraf:
  enabled: true # Value added by OpenEgiz to indicate if this component should be installed or not
  metrics:
    internal:
      enabled: false
  config:
# Do no modify
#!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
    processors: [] 
    outputs: [] 
    inputs: [] 
  service:
    enabled: false 
  volumes:
    - name: my-config
      configMap:
        name: openegiz-telegraf-real-config
  volumeMounts:
    - name: my-config
      mountPath: /additional_config
  args:
    - "--config=/etc/telegraf/telegraf.conf"
    - "--config-directory=/additional_config"
#!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!



# OpenEgiz recommended values for InfluxDB2
##################################################################
influxdb2:
  enabled: true # Value added by OpenEgiz to indicate if this component should be installed or not
  nameOverride: influxdb2
  persistence:
    enabled: true
  service:
    type: NodePort
    nodePort: 30716
  image:
    pullPolicy: Always
  adminUser:
    organization: "openegiz"
    bucket: "default"
    password: "password"
