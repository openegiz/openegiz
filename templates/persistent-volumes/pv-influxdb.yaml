{{- if and .Values.influxdb2.enabled .Values.persistentVolumes.influxdb2 }}

apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-openegiz-influxdb
spec:
  storageClassName: manual
  capacity:
    storage: 50Gi
  accessModes:
  - ReadWriteOnce
  hostPath:
    path: /ot-platform/influxdb

{{- end }}