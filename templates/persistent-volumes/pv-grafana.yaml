{{- if and .Values.grafana.enabled .Values.persistentVolumes.grafana }}

apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-openegiz-grafana
spec:
  volumeMode: Filesystem
  accessModes:
   - ReadWriteOnce
  capacity:
    storage: 10Gi
  hostPath:
    path: /openegiz/grafana
    type: DirectoryOrCreate

{{- end }}